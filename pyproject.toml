[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-memory"
version = "3.3.0"
description = "pudica-Memory v2.5 — SQLite + ChromaDB 双存储记忆系统：4层管线、多策略检索（TEMPR）、知识图谱、reflect/consolidation、本地 ONNX 中文嵌入"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2",
    "chromadb>=1.5.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.19.0",
    "numpy>=1.24.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
http = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]

[project.urls]
Homepage = "https://github.com/nousresearch/unified-memory"

[tool.setuptools.packages.find]
where = ["src"]
